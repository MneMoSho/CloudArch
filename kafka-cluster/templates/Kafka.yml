apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
spec:
  kafka:
    version: 4.0.0
    metadataVersion: 4.0-IV3
    listeners:
      {{- toYaml .Values.spec.kafka.listeners | nindent 6 }}
    authorization:
      type: simple
    rack:
      topologyKey: topology.kubernetes.io/zone
    {{- include "configRack" . | nindent 4 }}

    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml

  kafkaExporter:
    groupRegex: ".*"
    topicRegex: ".*"
    resources: 
      requests:
        cpu: 200m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
  logging:
    type: inline
    loggers:
      rootLogger.level: "INFO"
      appender.console.layout.type: JsonLayout
      appender.console.layout.compact: true
      appender.console.layout.eventEol: true

  entityOperator:
    topicOperator: {}
    userOperator: {}
