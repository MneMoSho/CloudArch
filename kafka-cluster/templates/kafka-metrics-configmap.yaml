apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: {{ .Values.namespace }}
  labels:
    strimzi.io/cluster: {{ .Values.clusterName }}
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      # Основные метрики брокера и топиков
      - pattern: kafka.server<type=(.+), name=(.+)PerSec\w*, topic=(.+)><>Count
        name: kafka_server_$1_$2_total
        labels:
          topic: "$3"
      - pattern: kafka.server<type=(.+), name=(.+)PerSec\w*><>Count
        name: kafka_server_$1_$2_total
      - pattern: kafka.server<type=(.+), name=(.+)><>Value
        name: kafka_server_$1_$2
      - pattern: kafka.server<type=(.+), name=(.+)><>Count
        name: kafka_server_$1_$2_total
      - pattern: kafka.server<type=ReplicaManager, name=(.+)><>(Value|Count)
        name: kafka_server_replicamanager_$1
      - pattern: kafka.server<type=MetadataLoader, name=(.+)><>Value
        name: kafka_server_metadataloader_$1