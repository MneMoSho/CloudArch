repositories:
  - name: strimzi
    url: https://strimzi.io/charts/
  - name: provectus
    url: https://provectus.github.io/kafka-ui-charts

environments:
  default: 
    values:
      - envFile: ./envs/test.yaml
  local:
    values:
      - envFile: ./envs/test.yaml
  azure: 
    values:
      - envFile: ./envs/azure.yaml
releases:
  - name: strimzi-operator
    namespace: kafka
    chart: strimzi/strimzi-kafka-operator
    createNamespace: true
    wait: true
    timeout: 300

  - name: kafka-chart
    namespace: kafka
    createNamespace: false
    chart: ./kafka-cluster

    needs:
      - kafka/strimzi-operator

    values:
      - ./kafka-cluster/values.yaml
      - {{ .Values.envFile }}
  - name: kafka-ui
    namespace: kafka
    values:
      - envs:
          config:
            KAFKA_CLUSTERS_0_NAME: "my-cluster"
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "my-cluster-kafka-bootstrap:9092"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi